# MotoAI — CI/CD Pipeline (GitHub Actions)
# Runs on push/PR to main: typecheck -> test -> build -> (optional evals) -> Docker image -> VPS deploy

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: "20"

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/motoai_test
      NEXTAUTH_SECRET: ci-test-secret-change-in-prod
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  build:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main' && secrets.VPS_HOST != ''
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /opt/motoai
            docker compose -f docker-compose.prod.yml images -q app > .previous-image 2>/dev/null || true
            docker compose -f docker-compose.prod.yml pull app
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            sleep 10
            for i in 1 2 3 4 5; do
              if curl -sf http://localhost:3000/api/health > /dev/null; then
                echo "Deploy successful"
                exit 0
              fi
              sleep 5
            done
            echo "Health check failed — rolling back"
            if [ -f .previous-image ]; then
              PREV=$(cat .previous-image)
              docker tag "$PREV" ghcr.io/${{ github.repository }}:rollback
              APP_VERSION=rollback docker compose -f docker-compose.prod.yml up -d app
            fi
            exit 1
